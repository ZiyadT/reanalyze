services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reanalyze-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: research_analyst

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d research_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: